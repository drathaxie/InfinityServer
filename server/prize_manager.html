<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Get Awesome Prize Item</title><style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 85% 15%,#6b1858 0 10%,transparent 28%),linear-gradient(120deg,#081827,#170718);font:14px/1.45 Arial,sans-serif;color:#160b10}.wrap{width:min(1180px,calc(100% - 24px));margin:6px auto 35px;background:#fff1bd;box-shadow:0 10px 35px #000a}.title{margin:0;background:#430b34;color:#fff;text-align:center;font-size:24px;padding:8px}.intro{padding:2px 28px 12px}.intro h2{font-size:23px;margin:2px 0 14px}.intro p{margin:10px 0}.toolbar{display:flex;gap:8px;align-items:center;padding:7px 14px;background:#edf0f4;border-top:1px solid #c8ccd2;border-bottom:1px solid #c8ccd2}.toolbar input{width:260px}.toolbar .push{margin-left:auto}button,input,select{font:inherit;padding:6px 9px;border:1px solid #c6cad0;background:#fff;border-radius:3px}button{cursor:pointer}.tablewrap{overflow:auto;padding:0 14px 18px}table{width:100%;border-collapse:collapse;background:#f5f5f5;font-size:13px}th,td{border:1px solid #c8cbd0;padding:5px;text-align:left;white-space:nowrap}th{background:#e2e5e9;color:#687080}.filters input,.filters select{width:100%;min-width:55px;padding:4px}.num{text-align:right}.center{text-align:center}.choose{background:#6d1c57;color:#fff;border-color:#4d103d;padding:4px 8px}.msg{padding:0 18px 16px;color:#247136;font-weight:bold}.bad{color:#9d2638}.loading{text-align:center;padding:30px}.login{padding:30px;text-align:center}.login a{color:#6d1c57;font-weight:bold}@media(max-width:650px){.wrap{width:100%;margin:0}.toolbar{flex-wrap:wrap}.toolbar input{width:100%}.toolbar .push{margin-left:0}.intro{padding:4px 14px}.title{font-size:20px}}
</style></head><body><main class="wrap"><h1 class="title">Get Awesome Prize Item</h1><section id="body"><div class="loading">Loading prize catalog…</div></section></main><script>
let csrf='',items=[];const types={1:'Item',2:'Pet',3:'Resource',4:'Resource',6:'Sword',7:'Dagger',8:'Axe',9:'Mace',10:'Staff',12:'Helm',15:'Cape',19:'Gun',20:'Polearm',21:'Class',22:'Armor',23:'House',24:'Wall Item',25:'Floor Item'},rarities={10:'Epic',11:'Rare',12:'Awesome',13:'Common',67:'Legendary',95:'Artifact',100:'Impossible'};const $=s=>document.querySelector(s);function esc(s){let d=document.createElement('div');d.textContent=s??'';return d.innerHTML}async function api(path,opt={}){opt.headers={...(opt.headers||{}),'Content-Type':'application/json'};if(csrf)opt.headers['X-CSRF-Token']=csrf;let r=await fetch('/account/api/'+path,opt),j=await r.json();if(!r.ok)throw Error(j.message||'Request failed');return j}
function shell(token){$('#body').innerHTML=`<div class="intro"><h2>Use ${esc(token)} token to Get Awesome Prize Item</h2><p>We recommend researching the exact item you want before choosing.<br>Talk to your friends or guildmates. Take your time before deciding.</p><p><b><i>KB Only</i></b> marks items reserved for Kickstarter Benevolent tokens.<br><b><i>Popularity</i></b> counts how many players have chosen that item through this server.</p><p>Once you have chosen your item, there are no refunds, exchanges or repicks.<br>Make sure you are choosing the exact item you want.</p></div><div class="toolbar"><input id="search" placeholder="⌕ Search..."><button id="clear">◆ Clear Filters</button><button id="reset" class="push">☑ Reset Prefs</button><button onclick="location.href='/account'">← Back</button></div><div class="tablewrap"><table><thead><tr><th>Item Name</th><th>Item Type</th><th>KB Only</th><th>Price</th><th>AC</th><th>Member</th><th>Popularity ↓</th><th>Rarity</th><th></th></tr><tr class="filters"><th><input id="fn" placeholder="⌕"></th><th><select id="ft"><option value="">All</option></select></th><th><select id="fk"><option value="">All</option><option>false</option><option>true</option></select></th><th><input id="fp" type="number" min="0" placeholder="⌕"></th><th><select id="fa"><option value="">(All)</option><option value="true">✓</option><option value="false">—</option></select></th><th><select id="fm"><option value="">(All)</option><option value="true">✓</option><option value="false">—</option></select></th><th></th><th><input id="fr" placeholder="⌕"></th><th></th></tr></thead><tbody id="rows"></tbody></table></div><div id="msg" class="msg"></div>`;$('#search').oninput=loadItems;['fn','ft','fk','fp','fa','fm','fr'].forEach(id=>$('#'+id).oninput=render);$('#clear').onclick=clear;$('#reset').onclick=clear}
async function loadItems(){let j=await api('catalog?q='+encodeURIComponent($('#search')?.value||'')+'&limit=5000');items=j.items;let sel=$('#ft'),cur=sel.value,names=[...new Set(items.map(x=>types[x.type]||'Item'))].sort();sel.innerHTML='<option value="">All</option>'+names.map(n=>`<option>${esc(n)}</option>`).join('');sel.value=cur;render()}
function render(){let n=$('#fn').value.toLowerCase(),t=$('#ft').value,k=$('#fk').value,p=$('#fp').value,a=$('#fa').value,m=$('#fm').value,r=$('#fr').value.toLowerCase();let out=items.filter(x=>(!n||x.name.toLowerCase().includes(n))&&(!t||(types[x.type]||'Item')===t)&&(!k||String(x.kbOnly)===k)&&(!p||x.price===Number(p))&&(!a||String(x.ac)===a)&&(!m||String(x.member)===m)&&(!r||(rarities[x.rarity]||String(x.rarity)).toLowerCase().includes(r)));$('#rows').innerHTML=out.map(x=>`<tr><td><b>${esc(x.name)}</b> <small>#${x.id}</small></td><td>${esc(types[x.type]||'Item')}</td><td class="center">${x.kbOnly?'✓':'false'}</td><td class="num">${x.price}</td><td class="center">${x.ac?'✓':''}</td><td class="center">${x.member?'✓':''}</td><td class="num">${x.popularity}</td><td>${esc(rarities[x.rarity]||String(x.rarity||'—'))}</td><td><button class="choose" data-id="${x.id}" data-name="${esc(x.name)}">Select</button></td></tr>`).join('')||'<tr><td colspan="9">No matching items.</td></tr>';document.querySelectorAll('.choose').forEach(b=>b.onclick=()=>redeem(Number(b.dataset.id),b.dataset.name,b))}
function clear(){['fn','ft','fk','fp','fa','fm','fr'].forEach(id=>$('#'+id).value='');render()}async function redeem(id,name,b){if(!confirm(`Spend one IoDA token for ${name} (#${id})? This cannot be undone.`))return;b.disabled=true;try{let j=await api('redeem',{method:'POST',body:JSON.stringify({itemId:id})});$('#msg').textContent=j.message;setTimeout(()=>location.href='/account',1000)}catch(e){$('#msg').textContent=e.message;$('#msg').classList.add('bad');b.disabled=false}}
async function start(){try{let me=await api('me');csrf=me.csrf;if(!me.tokenBalance){$('#body').innerHTML='<div class="login"><h2>No Awesome Item tokens found</h2><p><a href="/account">Return to Manage Account</a></p></div>';return}shell((me.tokens[0]||{}).name||'IoDA');await loadItems()}catch(e){$('#body').innerHTML='<div class="login"><h2>Please sign in first</h2><p><a href="/account">Go to Manage Account</a></p></div>'}}start();
</script></body></html>
