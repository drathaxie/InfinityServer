<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Player Support</title><style>
:root{--bg:#1d2127;--panel:#272c34;--panel2:#2f3640;--line:#3a4150;--ink:#e6e9ef;--muted:#9aa4b2;--accent:#5b8cff;--good:#3fa46a;--bad:#d06969}*{box-sizing:border-box}body{margin:0;font:14px/1.45 system-ui,Segoe UI,sans-serif;background:var(--bg);color:var(--ink)}header{display:flex;gap:9px;align-items:center;padding:11px 15px;background:var(--panel);border-bottom:1px solid var(--line);position:sticky;top:0}h1{font-size:16px;margin:0}main{max-width:1200px;margin:auto;padding:16px}.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px;margin-bottom:14px}h2{font-size:14px;color:var(--accent);margin:0 0 10px;text-transform:uppercase}input,select,textarea,button{font:inherit;color:var(--ink);background:var(--panel2);border:1px solid var(--line);border-radius:6px;padding:7px 9px}input,textarea{width:100%}button{cursor:pointer}button.primary{background:var(--good)}.row{display:flex;gap:8px;flex-wrap:wrap}.row>*{flex:1;min-width:120px}.players button{display:block;width:100%;text-align:left;margin:5px 0}.muted{color:var(--muted)}.status{margin-left:auto}.grid{display:grid;grid-template-columns:300px 1fr;gap:14px}table{width:100%;border-collapse:collapse}th,td{padding:6px;border-bottom:1px solid var(--line);text-align:left;font-size:12px}.scroll{max-height:320px;overflow:auto}@media(max-width:800px){.grid{grid-template-columns:1fr}}
</style></head><body><header><h1>Player Support</h1><span class="muted">Anonymous-by-design account tools</span><span id="status" class="status"></span></header>
<main><div class="grid"><section class="card"><h2>Find player</h2><div class="row"><input id="q" placeholder="Username, character, or character ID"><button onclick="search()">Search</button></div><div id="players" class="players"></div></section>
<div><section class="card"><h2>Player</h2><div id="summary" class="muted">Select a player.</div></section>
<section class="card"><h2>Audited grant</h2><div class="row"><select id="kind"><option value="item">Item</option><option value="coins">AdventureCoins</option><option value="gold">Gold</option><option value="membership">Membership days</option></select><input id="value" type="number" placeholder="Item ID or amount"><input id="qty" type="number" value="1" min="1" placeholder="Quantity"></div><textarea id="reason" placeholder="Required support reason"></textarea><button class="primary" onclick="grant()">Apply grant</button></section>
<section class="card"><h2>Inventory</h2><div id="inventory" class="scroll"></div></section><section class="card"><h2>Account activity</h2><div id="history" class="scroll"></div></section></div></div>
<section class="card"><h2>Redeem code manager</h2><div class="row"><input id="code" placeholder="CODE"><input id="desc" placeholder="Description"><input id="max" type="number" value="0" placeholder="Max uses (0 unlimited)"></div><textarea id="rewards" placeholder='Rewards JSON, e.g. [{"type":"item","value":50727,"quantity":10},{"type":"coins","value":10000}]'></textarea><button class="primary" onclick="saveCode()">Save code</button><button onclick="loadCodes()">Refresh list</button><div id="codes" class="scroll"></div></section></main>
<script src="/editor/nav.js"></script><script>
let csrf='',selected=0;const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const msg=(s,bad=false)=>{status.textContent=s;status.style.color=bad?'var(--bad)':'var(--muted)'};
async function api(path,opt={}){opt.headers={...(opt.headers||{}),'Content-Type':'application/json','X-Staff-CSRF':csrf};let r=await fetch(path,opt),j=await r.json();if(!r.ok)throw Error(j.message||j.error||'Request failed');return j}
async function init(){let j=await api('/support/session');csrf=j.csrf;msg('Signed in as '+j.staff);loadCodes()}
async function search(){try{let j=await api('/support/search?q='+encodeURIComponent(q.value));players.innerHTML=j.players.map(p=>`<button onclick="openPlayer(${p.charId})"><b>${esc(p.name)}</b> <span class=muted>#${p.charId} · Lv ${p.level} · ${p.coins} AC</span></button>`).join('')||'<p class=muted>No matches.</p>'}catch(e){msg(e.message,true)}}
async function openPlayer(id){selected=id;try{let p=(await api('/support/player?charId='+id)).player;summary.innerHTML=`<b>${esc(p.name)}</b> · Character #${p.charId}<br>${p.level} level · ${p.gold} gold · ${p.coins} AC · ${p.membershipDays} member days`;inventory.innerHTML=table(['Item','Qty','Location'],p.inventory.map(x=>[`${esc(x.name)} (#${x.itemId})`,x.quantity,x.banked?'Bank':'Inventory']));history.innerHTML=table(['When','Action','Change','Reason'],p.history.map(x=>[new Date(x.created*1000).toLocaleString(),esc(x.action),x.item?`${esc(x.item)} ×${x.quantity||1}`:`${esc(x.currency||'')} ${x.amount??''}`,esc(x.detail)]))}catch(e){msg(e.message,true)}}
function table(h,rows){return `<table><thead><tr>${h.map(x=>'<th>'+x+'</th>').join('')}</tr></thead><tbody>${rows.map(r=>'<tr>'+r.map(x=>'<td>'+x+'</td>').join('')+'</tr>').join('')}</tbody></table>`}
async function grant(){if(!selected)return msg('Select a player first.',true);try{let j=await api('/support/grant',{method:'POST',body:JSON.stringify({charId:selected,type:kind.value,value:value.value,quantity:qty.value,reason:reason.value})});msg(j.message);reason.value='';openPlayer(selected)}catch(e){msg(e.message,true)}}
async function saveCode(){try{let j=await api('/support/code/save',{method:'POST',body:JSON.stringify({code:code.value,description:desc.value,maxUses:max.value,active:true,rewards:JSON.parse(rewards.value)})});msg(j.message);loadCodes()}catch(e){msg(e.message,true)}}
async function loadCodes(){try{let j=await api('/support/codes');codes.innerHTML=table(['Code','Description','Uses','Rewards'],j.codes.map(c=>[esc(c.code),esc(c.description),`${c.uses}/${c.maxUses||'∞'}`,esc(c.rewards.map(r=>`${r.reward_qty}× ${r.reward_type}:${r.reward_value}`).join(', '))]))}catch(e){msg(e.message,true)}}
q.addEventListener('keydown',e=>{if(e.key==='Enter')search()});init().catch(e=>msg(e.message,true));
</script></body></html>
